[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "agent-fill"
version = "0.1.0"
description = "Temporal grounding skill and MCP server for LLM agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP -> MCPServer; server.py imports FastMCP from mcp 1.9.x
mcp = [
    "mcp==1.9.4",
    "pydantic>=2.8,<2.10",
]

[project.scripts]
agent-fill = "agent_fill.cli:main"
agent-fill-mcp = "agent_fill.mcp_stdio:main"

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "scripts"
"references" = "references"
"mcp_server" = "mcp_server"

[tool.hatch.build.targets.sdist]
include = [
    "/agent_fill",
    "/scripts",
    "/references",
    "/mcp_server",
    "/evals",
    "/SKILL.md",
]